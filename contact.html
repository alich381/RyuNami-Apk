<!DOCTYPE html>
<html lang="id">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron', sans-serif;
}

body{
    background: radial-gradient(circle at top, #0c0f1a, #05060c);
    color:#fff;
    min-height:100vh;
    padding-top:60px;
    overflow-y:auto;
}

/* HEADER */
.header{
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header h1{
    font-size:18px;
    letter-spacing:2px;
    color:#9dfcff;
}

/* PROFILE */
.profile{
    text-align:center;
    margin-top:10px;
}

.top-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: rgba(10, 12, 22, .85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    z-index: 999;
}

  .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(to right, #fff, #0F21DD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px #0F21DD;
  }

/* ICON BUTTON */
.icon-btn {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, .06);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: .25s;
}

.icon-btn i {
    font-size: 18px;
}

/* POSISI */
.icon-btn.left {
    left: 12px;
}

.icon-btn.right {
    right: 12px;
}

/* HOVER */
.icon-btn:hover {
    background: rgba(0, 229, 255, .15);
    box-shadow: 0 0 15px rgba(0, 229, 255, .5);
    transform: scale(1.05);
}
        
.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg,   #1323D6,#000000);
    margin: auto;
    box-shadow: 0 0 25px rgba(19, 35, 214, 1);
}

.avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

.profile h2 {
    margin-top: 15px;
    font-size: 28px;
    letter-spacing: 2px;
}

.profile p{
    margin-top:6px;
    font-size:12px;
    color:#1A29CD;
    letter-spacing:3px;
}

/* CONTAINER */
.container{
    margin:30px 16px 90px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* BUTTON CARD */
.link-card{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 25px rgba(0,0,0,.6);
    text-decoration:none;
    color:#fff;
    transition:.3s;
}

.link-card:hover{
    transform:scale(1.02);
    box-shadow:0 0 35px rgba(22, 34, 173, 1);
}

.icon{
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    background:linear-gradient(135deg,#0F21DD,#030623);
    box-shadow:0 0 15px rgba(0,229,255,.5);
}

.text h3{
    font-size:16px;
}

.text span{
    font-size:12px;
    color:#aaa;
}

/* NAVBAR */
 .navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(10, 12, 22, .9);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, .06);
    z-index: 1000;
}
        
        /* Reset radius di Mobile */
        @media (max-width: 767px) {
            .navbar { border-radius:     0; }
        }

        .navbar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, #0F21DD, transparent);
            opacity: 0.8;
        }
        
        .nav-item {
            font-size: 1.4rem;
            color: #666;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            width: 60px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
        }
        .nav-item.active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: 5px;
            width: 5px; height: 5px; background: #fff;
            border-radius: 50%; box-shadow: 0 0 10px #fff;
        }
        .nav-item:hover { color: var(--primary-purple); }

</style>
</head>
