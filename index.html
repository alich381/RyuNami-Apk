<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RyuNami Apps</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="bg-particles"></div>

  <header class="topbar glass">
    <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
    <h1 class="title">RyuNami Apps</h1>
    <button class="icon-btn" id="themeToggle"><i class="fa-solid fa-palette"></i></button>
  </header>

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
   <div class="glass hero time-logo-container">
  
  <!-- JAM -->
  <div class="time-box">
    <div id="time" class="time-small">00:00</div>
    <div id="zone" class="zone-small">Asia/Jakarta</div>
  </div>

  <!-- LOGO AUTO SLIDE -->
  <div class="logo-slider">
    <div class="logo-track">
      <img src="https://files.catbox.moe/h7y2sd.jpg">
      <img src="https://files.catbox.moe/sfomhw.jpg">
      <img src="https://files.catbox.moe/nrsbve.jpg">
      <!-- ulang biar looping -->
      <img src="https://files.catbox.moe/h7y2sd.jpg">
      <img src="https://files.catbox.moe/sfomhw.jpg">
    </div>
  </div>

</div>

    <div class="menu-grid">
      <div class="menu-card" onclick="openPage('tiktok')">
        <i class="fa-brands fa-tiktok"></i>
        <span>TikTok No WM</span>
      </div>
      <div class="menu-card" onclick="openPage('instagram')">
        <i class="fa-brands fa-instagram"></i>
        <span>IG No WM</span>
      </div>
      <div class="menu-card" onclick="openPage('youtube')">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube DL</span>
      </div>
      <div class="menu-card" onclick="openPage('chat')">
        <i class="fa-solid fa-robot"></i>
        <span>AI Chat</span>
      </div>
    </div>
  </section>

<!-- MUSIC PLAYER -->
<section class="music-section">
  <div class="music-card glass">
    <div class="music-header">
      <i class="fa-solid fa-music"></i>
      <div>
        <div class="music-title">Replay</div>
        <div class="music-artist">Iyaz</div>
      </div>
    </div>

    <div class="visualizer" id="visualizer">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="controls">
      <button onclick="toggleMusic()">
        <i id="playIcon" class="fa-solid fa-pause"></i>
      </button>
    </div>

<audio id="bgMusic" autoplay loop>
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyuNami Apps</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="topbar">
  <h1>RyuNami Apps</h1>
</header>

<!-- JAM + LOGO -->
<div class="time-logo-box">
  <div class="time">
    <div id="clock">17:05</div>
    <div id="zone">Asia/Jakarta</div>
  </div>

  <img class="logo" src="https://files.catbox.moe/h7y2sd.jpg">
</div>

<!-- MENU -->
<div class="menu">
  <div class="card"><i class="fa-brands fa-tiktok"></i><span>TikTok No WM</span></div>
  <div class="card"><i class="fa-brands fa-instagram"></i><span>IG No WM</span></div>
  <div class="card"><i class="fa-brands fa-youtube"></i><span>YouTube DL</span></div>
  <div class="card"><i class="fa-solid fa-robot"></i><span>AI Chat</span></div>
</div>

<!-- MUSIC -->
<div class="music-box">
  <div class="visualizer">
    <span></span><span></span><span></span><span></span>
  </div>

  <button onclick="toggleMusic()" id="musicBtn">
    <i class="fa-solid fa-play"></i>
  </button>

  <audio id="music">
    <source src="https://files.catbox.moe/uoiwkw.mp3" type="audio/mpeg">
  </audio>
</div>

<script src="script.js"></script>
</body>
  </html>
