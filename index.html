<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RyuNami Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="time-box" id="time">00:00:00</div>

  <div class="tools">
    <a href="tt.html" class="tool">TikTok No WM</a>
    <a href="ig.html" class="tool">IG No WM</a>
    <a href="yt.html" class="tool">YouTube DL</a>
    <a href="ai.html" class="tool">AI Chat</a>
  </div>

<!-- MUSIC PLAYER -->
<section class="music-section">
  <div class="music-card glass">
    <div class="music-header">
      <i class="fa-solid fa-music"></i>
      <div>
        <div class="music-title">Replay</div>
        <div class="music-artist">Iyaz</div>
      </div>
    </div>

    <div class="visualizer" id="visualizer">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="controls">
      <button onclick="toggleMusic()">
        <i id="playIcon" class="fa-solid fa-pause"></i>
      </button>
    </div>

    <audio id="bgMusic" controls loop>
      <source src="" type="audio/mpeg">
    </audio>
  </div>
</section>
<script src="script.js"></script>
</body>
  </html>
