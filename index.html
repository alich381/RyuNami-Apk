
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyuNami Apps</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="topbar">
  <h1>RyuNami Apps</h1>
</header>

<!-- JAM + LOGO -->
<div class="time-container">
  <div class="time-box" id="time">00.00</div>

  <div class="logo-box">
    <img src="https://files.catbox.moe/h7y2sd.jpg">
  </div>
</div>
<!-- MENU -->
<div class="menu">
  <div class="card"><i class="fa-brands fa-tiktok"></i><span>TikTok No WM</span></div>
  <div class="card"><i class="fa-brands fa-instagram"></i><span>IG No WM</span></div>
  <div class="card"><i class="fa-brands fa-youtube"></i><span>YouTube DL</span></div>
  <div class="card"><i class="fa-solid fa-robot"></i><span>AI Chat</span></div>
</div>

<!-- MUSIC -->
<div class="music-box">
  <div class="visualizer">
    <span></span><span></span><span></span><span></span>
  </div>

  <button onclick="toggleMusic()" id="musicBtn">
    <i class="fa-solid fa-play"></i>
  </button>

  <audio id="music">
    <source src="https://files.catbox.moe/uoiwkw.mp3" type="audio/mpeg">
  </audio>
</div>

<script src="script.js"></script>
</body>
  </html>
